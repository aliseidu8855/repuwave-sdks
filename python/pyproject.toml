[project]
name = "repuwave-sdk"
version = "0.1.0"
description = "Official Python SDK for the Repuwave Trust & Reputation API"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "ecdsa>=0.19,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
