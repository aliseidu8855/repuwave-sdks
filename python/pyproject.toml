[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repuwave-sdk"
version = "0.1.0"
description = "Official Python SDK for the Repuwave Trust & Reputation API"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "pynacl>=1.5,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["repuwave_sdk*"]
