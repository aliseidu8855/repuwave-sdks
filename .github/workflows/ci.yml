name: CI

# This repository had no CI at all, which is why the Python SDK's test suite
# went an entire crypto migration without running: it imported a class that no
# longer existed, failed at *collection*, and nothing reported it. A suite that
# cannot be collected and a suite that passes both show zero failures — only
# running it distinguishes them.
#
# The conformance job is the other half. The signing protocol is implemented
# independently here and in repuwave-core, and the two must produce byte-identical
# canonical payloads or every signature this SDK produces fails verification in
# production. `conformance/protocol_vectors.json` is generated by the core repo
# and checked against here, so no cross-repo clone or Django install is needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Also run when the server's protocol changes, by asking the core repo's CI to
  # dispatch. Without this, a server-side canonical-form change would only be
  # discovered the next time someone happened to push here.
  repository_dispatch:
    types: [protocol-changed]

jobs:
  python-sdk:
    name: Python SDK (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -q

  node-sdk:
    name: Node SDK (jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm test

  conformance:
    name: Protocol conformance (golden vectors)
    runs-on: ubuntu-latest
    # Separate from the test jobs so a failure here reads as what it is: the SDK
    # and the server disagree about the signing protocol, which breaks every
    # integration, rather than a bug in the SDK's own logic.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Python SDK
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify the vectors are present
        # A missing file would make the conformance suite skip or fail for the
        # wrong reason. Checked explicitly so the message names the real problem.
        run: |
          test -f conformance/protocol_vectors.json || {
            echo "::error::conformance/protocol_vectors.json is missing.";
            echo "It is generated in repuwave-core by scripts/generate_protocol_vectors.py";
            echo "and checked in here. Without it, compatibility is untested.";
            exit 1;
          }

      - name: Assert the SDK matches the server's canonical form
        working-directory: python
        run: pytest tests/test_protocol_conformance.py -q
